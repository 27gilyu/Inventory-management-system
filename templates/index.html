<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeckTrack &middot; Eco Deckmasters</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>

    <!-- Top navigation bar (plain labels, no links yet) -->
    <header class="topbar">
        <span class="brand">
            <span class="logo">&#9635;</span>
            Deck<span class="brand-accent">Track</span>
        </span>
        <nav class="nav-links">
            <span class="active">Home</span>
            <span>Stock</span>
            <span>Sales</span>
            <span>Invoices</span>
            <span>Estimator</span>
            <span>Job Map</span>
        </nav>
        <span class="nav-user">Davinder Brar</span>
    </header>

    <!-- Welcome -->
    <section class="hero">
        <div class="hero-text">
            <p class="eyebrow">Eco Deckmasters</p>
            <h1>Welcome to DeckTrack</h1>
        </div>

        <div class="hero-card">
            <div class="hero-card-head">
                <span class="dot"></span> Today
            </div>
            <div class="mini-stat">
                <span>Stock items</span><b>10</b>
            </div>
            <div class="mini-stat">
                <span>Low stock</span><b class="warn">3</b>
            </div>
            <div class="mini-stat">
                <span>Sales today</span><b>12</b>
            </div>
            <div class="mini-alert">&#9888; Composite Decking Board is running low</div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="footer">
        <p><b>DeckTrack</b> &middot; Eco Deckmasters &middot; Dandenong South VIC</p>
    </footer>

</body>
</html>
