<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in &middot; DeckTrack</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>
<body>

    <div class="login-wrap">
        <div class="login-box">
            <div class="brand-lg">
                <span class="logo">&#9635;</span>
                <span>Deck<span class="brand-accent">Track</span></span>
            </div>
            <p class="login-sub">Eco Deckmasters</p>

            <!-- Logging in takes you to the home page -->
            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-green">Log in</button>
            </form>
        </div>
    </div>

</body>
</html>
